name: suristanya_app
description: "AI-powered health screening with Suristanya."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  pdf: ^3.11.1
  printing: ^5.13.4
  camera: ^0.11.0+2
  image: ^4.2.0
  path_provider: ^2.1.5
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3
  win_plugin_link_repair: ^0.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/guides/
    - assets/icon/
    - assets/splash/

# ─── APP ICON ─────────────────────────────────────────────
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#1E3A8A"
    theme_color: "#1E3A8A"

# ─── SPLASH SCREEN ────────────────────────────────────────
flutter_native_splash:
  color: "#1E3A8A"
  color_dark: "#0F2563"
  web: true
  android: true
  ios: true 